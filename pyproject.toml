[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "texport"
version = "1.0.0"
description = "Scroll-capture any window's text, mark what matters, export an AI handoff (MG8-ready)"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "American Milestone Inc." }]
dependencies = []          # PySide6 is installed by the snap / installer

[project.scripts]
texport = "texport.app:main"

[tool.setuptools]
packages = ["texport"]
