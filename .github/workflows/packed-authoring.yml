name: Packed authoring tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offscreen Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install pytest PySide6
      - name: Core, malformed-input and real offscreen UI tests
        run: python -m pytest tests -q
      - name: Legacy auto-scroll script
        run: python tests/test_autoscroll.py
